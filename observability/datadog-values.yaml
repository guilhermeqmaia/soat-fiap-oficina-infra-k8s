# Datadog Agent no EKS (US-F3-10) — plataforma primaria escolhida na ADR-0004.
#
#   helm repo add datadog https://helm.datadoghq.com && helm repo update
#   kubectl -n datadog create secret generic datadog-secret \
#     --from-literal=api-key=<DD_API_KEY>
#   helm upgrade --install datadog datadog/datadog \
#     -n datadog --create-namespace -f observability/datadog-values.yaml
#
# Sem IRSA (AWS Academy nao permite OIDC): a API key vem de um Secret do
# cluster, nao de uma role.
datadog:
  site: datadoghq.com
  apiKeyExistingSecret: datadog-secret
  clusterName: oficina-mecanica-eks

  # --- Metricas de infra do Kubernetes: CPU/memoria por pod e por node ---
  kubeStateMetricsEnabled: true
  kubeStateMetricsCore:
    enabled: true

  # --- APM: recebe os traces do dd-trace da aplicacao (DD_TRACE_ENABLED=true) ---
  apm:
    portEnabled: true
    socketEnabled: true

  # --- Logs: correlacionados aos traces por trace_id (logInjection no app) ---
  logs:
    enabled: true
    containerCollectAll: true

  processAgent:
    enabled: true

  # --- Scrape do /metrics da aplicacao (OpenMetrics) ---
  # Mesmo endpoint que um Prometheus consumiria: a escolha de fornecedor nao
  # muda a instrumentacao (ADR-0004).
  prometheusScrape:
    enabled: true
    serviceEndpoints: true
    # Mapeamento explicito das metricas da app (Service oficina-app com as
    # annotations prometheus.io/*): garante os nomes que dashboards.tf e
    # monitors.tf consomem (oficina.os_transicoes.count, ...). Sem isto o
    # nome vira o derivado automatico (ex.: oficina.os_transicoes_count).
    additionalConfigs:
      - autodiscovery:
          kubernetes_annotations:
            include:
              prometheus.io/scrape: "true"
          kubernetes_container_names: ["app"]
        configurations:
          - namespace: oficina
            # OpenMetrics v2: contadores sao referenciados SEM o sufixo _total
            # (o check o remove antes de casar o nome) e viram <ns>.<nome>.count.
            metrics:
              - oficina_os_transicoes: os_transicoes
              - oficina_integracoes: integracoes
              - oficina_os_tempo_no_status_seconds: os_tempo_no_status_seconds
              - oficina_http_request_duration_seconds: http_request_duration_seconds

clusterAgent:
  enabled: true
  metricsProvider:
    # Permite HPA por metrica customizada no futuro; o HPA atual usa CPU/memoria
    # do metrics-server (ADR-0002).
    enabled: false

agents:
  containers:
    agent:
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: 400m, memory: 512Mi }
