name: Configurar credenciais AWS
description: >
  Autentica na AWS aceitando os dois modelos, para o projeto ser portavel entre
  contas: OIDC (role assumida sem chave estatica, preferido) ou chaves de acesso
  (necessario no AWS Academy/Learner Lab, que nao permite criar IAM roles e
  entrega credenciais temporarias com session token).

inputs:
  aws-region:
    description: 'Regiao AWS (ex.: us-east-1)'
    required: true
  role-to-assume:
    description: 'ARN da role assumida via OIDC. Vazio => usa chaves de acesso.'
    required: false
    default: ''
  access-key-id:
    description: 'AWS_ACCESS_KEY_ID (quando nao houver OIDC)'
    required: false
    default: ''
  secret-access-key:
    description: 'AWS_SECRET_ACCESS_KEY (quando nao houver OIDC)'
    required: false
    default: ''
  session-token:
    description: 'AWS_SESSION_TOKEN (credenciais temporarias do Learner Lab)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validar entradas
      shell: bash
      run: |
        if [ -z "${{ inputs.role-to-assume }}" ] && [ -z "${{ inputs.access-key-id }}" ]; then
          echo "::error::Configure o secret AWS_ROLE_ARN (OIDC) ou AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (+ AWS_SESSION_TOKEN no AWS Academy)."
          exit 1
        fi

    - name: OIDC (role assumida)
      if: inputs.role-to-assume != ''
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: gha-oficina-infra-k8s

    - name: Chaves de acesso
      if: inputs.role-to-assume == ''
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ inputs.aws-region }}
        aws-access-key-id: ${{ inputs.access-key-id }}
        aws-secret-access-key: ${{ inputs.secret-access-key }}
        aws-session-token: ${{ inputs.session-token }}

    - name: Identidade efetiva
      shell: bash
      run: aws sts get-caller-identity
