name: CI

# Roda em todo PR (checagem obrigatoria da branch protegida) e nos pushes.
# fmt/validate nao tocam a AWS; o `terraform plan` roda apenas quando ha
# credenciais configuradas e e comentado no PR.

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: fmt + validate (${{ matrix.stage }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stage: [cluster, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt -check
        run: terraform -chdir=${{ matrix.stage }} fmt -check -diff

      - name: terraform init (sem backend)
        run: terraform -chdir=${{ matrix.stage }} init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir=${{ matrix.stage }} validate

  plan:
    name: plan comentado no PR (${{ matrix.stage }})
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stage: [cluster, gateway]
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre-requisitos do plan deste stage existem?
        id: guard
        run: |
          ok=true
          { [ -n "${{ secrets.AWS_ROLE_ARN }}" ] || [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; } || ok=false
          [ -n "${{ secrets.TF_STATE_BUCKET }}" ] || ok=false
          if [ "${{ matrix.stage }}" = "cluster" ]; then
            [ -n "${{ vars.LAB_ROLE_ARN }}" ] || ok=false
          else
            # gateway depende dos outputs da Lambda (US-F3-01) e do deploy no EKS (US-F3-06)
            [ -n "${{ vars.AUTH_LAMBDA_ARN }}" ] && [ -n "${{ vars.BACKEND_LISTENER_ARN }}" ] \
              && [ -n "${{ vars.VPC_LINK_SUBNET_IDS }}" ] && [ -n "${{ vars.VPC_LINK_SECURITY_GROUP_IDS }}" ] || ok=false
          fi
          echo "configured=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = true ] || echo "::notice::Plan de ${{ matrix.stage }} ignorado — faltam credenciais/vars (fmt/validate ja cobriram o PR). Ver README secao CI/CD."

      - name: Credenciais AWS
        if: steps.guard.outputs.configured == 'true'
        uses: ./.github/actions/aws-credentials
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - uses: hashicorp/setup-terraform@v3
        if: steps.guard.outputs.configured == 'true'
        with:
          terraform_version: 1.9.8

      - name: init com state remoto + plan
        if: steps.guard.outputs.configured == 'true'
        id: plan
        working-directory: ${{ matrix.stage }}
        run: |
          # Backend S3 apenas no CI (override file) — local segue com state local.
          printf 'terraform {\n  backend "s3" {}\n}\n' > backend_override.tf
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=oficina-infra-k8s/${{ matrix.stage }}/homolog.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"
          bash ../.github/scripts/write-tfvars.sh ${{ matrix.stage }} ci.auto.tfvars
          terraform plan -input=false -no-color -out=tf.plan | tee plan.txt
        env:
          LAB_ROLE_ARN: ${{ vars.LAB_ROLE_ARN }}
          AUTH_LAMBDA_ARN: ${{ vars.AUTH_LAMBDA_ARN }}
          BACKEND_LISTENER_ARN: ${{ vars.BACKEND_LISTENER_ARN }}
          VPC_LINK_SUBNET_IDS: ${{ vars.VPC_LINK_SUBNET_IDS }}
          VPC_LINK_SECURITY_GROUP_IDS: ${{ vars.VPC_LINK_SECURITY_GROUP_IDS }}

      - name: Comentar o plan no PR
        if: steps.guard.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ matrix.stage }}/plan.txt', 'utf8');
            const body = [
              `### \`terraform plan\` — ${{ matrix.stage }}`,
              '<details><summary>Saida completa</summary>',
              '',
              '```',
              plan.slice(-60000),
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
